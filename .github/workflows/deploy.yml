name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: docker build -t YOUR_USERNAME/backend ./backend

      - name: Push Backend Image
        run: docker push YOUR_USERNAME/backend

      - name: Build Frontend Image
        run: docker build -t YOUR_USERNAME/frontend ./frontend

      - name: Push Frontend Image
        run: docker push YOUR_USERNAME/frontend